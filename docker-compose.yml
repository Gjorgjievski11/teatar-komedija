version: '3.1'
services:
    mysql:
        image: 'mysql:8.0'
        working_dir: /application
        container_name: komedija-mysql
        restart: always
        volumes:
            - '.:/application'
            - ./data:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
            - MYSQL_DATABASE=${DB_DATABASE}
            - MYSQL_USER=${DB_USERNAME}
            - MYSQL_PASSWORD=${DB_PASSWORD}
        ports:
            - '10601:3306'

    webserver:
        image: 'nginx:alpine'
        container_name: komedija-webserver
        restart: always
        working_dir: /application
        volumes:
            - '.:/application'
            - './phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        ports:
            - '10600:80'

    php-fpm:
        build: phpdocker/php-fpm
        container_name: komedija-php-fpm
        restart: always
        working_dir: /application
        volumes:
            - '.:/application'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.4/fpm/conf.d/99-overrides.ini'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.4/cli/conf.d/99-overrides.ini'

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: komedija-phpmyadmin
        restart: always
        environment:
            PMA_HOST: mysql
            UPLOAD_LIMIT: 500M
        ports:
            - 10602:80
